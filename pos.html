<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0876bd">
  <meta name="description" content="Màn hình bán hàng tại quầy NutriMart AI.">
  <title>NutriMart AI | Bán hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/pos.css?v=4.0">
</head>
<body>
  <div class="pos-app">
    <header class="pos-header">
      <a class="pos-brand" href="admin.html"><span>N</span><strong>NutriMart</strong><small>BÁN HÀNG</small></a>
      <div class="invoice-tabs"><button class="active" type="button">Hóa đơn 1 <b>×</b></button><button class="new-tab" type="button" title="Thêm hóa đơn">＋</button></div>
      <div class="pos-header-actions"><span class="connection"><i></i>Đang đồng bộ</span><a href="admin.html">Quản lý</a><a href="index.html" target="_blank" rel="noopener">Website ↗</a><button type="button" aria-label="Thiết lập">⚙</button><span class="cashier">NM</span></div>
    </header>

    <main class="pos-workspace">
      <section class="product-pane">
        <div class="search-row">
          <label class="product-search">⌕<input id="pos-product-search" autocomplete="off" placeholder="Tìm hàng hóa theo tên, mã hàng (F3)"></label>
          <button class="scan-button" type="button" title="Quét mã vạch">▤</button>
          <select id="pos-category-filter" aria-label="Nhóm hàng"><option value="all">Tất cả nhóm hàng</option></select>
        </div>
        <div class="category-strip" id="pos-category-strip"></div>
        <div class="product-list-head"><span>Hàng hóa</span><span>Giá bán</span><span>Tồn kho</span><span></span></div>
        <div class="product-list" id="pos-product-list"></div>
        <div class="product-empty" id="pos-product-empty" hidden>Không tìm thấy hàng hóa phù hợp.</div>
      </section>

      <aside class="invoice-pane">
        <div class="invoice-head">
          <div><h1>Hóa đơn 1</h1><p id="invoice-time"></p></div>
          <button id="clear-invoice" type="button">Xóa hóa đơn</button>
        </div>

        <div class="customer-box">
          <span>♙</span>
          <div><label for="pos-customer-name">Khách hàng</label><input id="pos-customer-name" autocomplete="off" placeholder="Khách lẻ"></div>
          <input id="pos-customer-phone" autocomplete="off" placeholder="Số điện thoại">
          <button type="button" title="Thêm khách hàng">＋</button>
        </div>

        <div class="cart-head"><span>Hàng hóa</span><span>SL</span><span>Thành tiền</span><span></span></div>
        <div class="cart-lines" id="pos-cart-lines"></div>

        <div class="invoice-note"><label>✎<input id="pos-order-note" placeholder="Ghi chú hóa đơn"></label></div>

        <div class="invoice-summary">
          <div><span>Tổng tiền hàng</span><strong id="pos-subtotal">0₫</strong></div>
          <div><label for="pos-discount">Giảm giá</label><span class="money-input"><input id="pos-discount" type="number" min="0" value="0"><b>₫</b></span></div>
          <div class="grand-total"><span>Khách cần trả</span><strong id="pos-grand-total">0₫</strong></div>
          <div><span>Khách thanh toán</span><strong id="pos-payment-amount">0₫</strong></div>
        </div>

        <div class="payment-methods">
          <label><input name="pos-payment" type="radio" value="Tiền mặt" checked><span>💵 Tiền mặt</span></label>
          <label><input name="pos-payment" type="radio" value="Chuyển khoản"><span>▦ Chuyển khoản</span></label>
          <label><input name="pos-payment" type="radio" value="Thẻ"><span>▤ Thẻ</span></label>
        </div>

        <div class="invoice-actions">
          <button class="secondary-action" id="hold-invoice" type="button">⌛ Lưu tạm</button>
          <button class="secondary-action" id="print-invoice" type="button">▧ In tạm tính</button>
          <button class="pay-action" id="complete-sale" type="button" disabled>THANH TOÁN <small>F9</small></button>
        </div>
      </aside>
    </main>
  </div>

  <dialog class="receipt-modal" id="receipt-modal">
    <div class="receipt-success">✓</div>
    <h2>Thanh toán thành công</h2>
    <p id="receipt-code"></p>
    <strong id="receipt-total"></strong>
    <div><button id="new-invoice" type="button">Tạo hóa đơn mới</button><a href="admin.html#orders">Xem danh sách hóa đơn</a></div>
  </dialog>

  <div class="pos-toast" id="pos-toast" role="status"></div>
  <script src="assets/js/data.js?v=4.0"></script>
  <script src="assets/js/pos.js?v=4.0"></script>
</body>
</html>
